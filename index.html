<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sraz planovac</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f7; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100vh; padding: 28px; }
    .top, .grid, .timeline { max-width: 1360px; margin-inline: auto; }
    .top { align-items: end; display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: #386641; font-size: 13px; font-weight: 800; margin: 0 0 8px; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 42px; line-height: 1; }
    h2 { font-size: 21px; }
    h3 { font-size: 17px; }
    .stats, .panel, .timeline { background: #fff; border: 1px solid #d8dee7; border-radius: 8px; box-shadow: 0 12px 32px rgba(17,24,39,.08); }
    .stats { display: flex; gap: 8px; padding: 8px; box-shadow: none; }
    .stats span { background: #f7f8fb; border-radius: 6px; font-size: 14px; font-weight: 750; padding: 7px 12px; white-space: nowrap; }
    .grid { display: grid; gap: 18px; grid-template-columns: minmax(330px,420px) minmax(0,1fr); }
    .panel, .timeline { padding: 20px; }
    .title { display: grid; gap: 4px; margin-bottom: 16px; }
    .title p { color: #667085; font-size: 14px; }
    .form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    label { color: #374151; display: grid; font-size: 13px; font-weight: 750; gap: 6px; }
    label:first-child { grid-column: 1 / -1; }
    input { background: #f9fafb; border: 1px solid #cfd6e2; border-radius: 7px; color: #111827; font: inherit; min-height: 42px; padding: 0 11px; }
    input:focus { border-color: #2563eb; outline: 3px solid rgba(37,99,235,.16); }
    .check { align-items: center; align-self: end; display: flex; gap: 9px; min-height: 42px; }
    .check input { min-height: auto; width: 18px; }
    .actions { display: flex; gap: 10px; margin: 16px 0 18px; }
    button { border: 0; border-radius: 7px; cursor: pointer; font: inherit; font-weight: 800; min-height: 42px; padding: 0 14px; }
    .primary { background: #2563eb; color: #fff; flex: 1; }
    .ghost { background: #eef2f7; color: #374151; }
    .rules, .results, .days { display: grid; gap: 10px; }
    .rule, .result { border: 1px solid #e1e6ef; border-radius: 8px; padding: 12px; }
    .rule strong, .result strong { display: block; }
    .rule span, .result span, small, .empty { color: #667085; font-size: 13px; }
    .results { grid-template-columns: repeat(3,minmax(0,1fr)); }
    ul { list-style: none; margin: 10px 0 0; padding: 0; }
    li { border-top: 1px solid #edf0f5; display: grid; gap: 2px; padding: 9px 0; }
    li:first-child { border-top: 0; }
    .time { color: #2563eb; font-weight: 800; }
    .timeline { margin-top: 18px; }
    .days { grid-template-columns: repeat(7,minmax(0,1fr)); }
    .day { border: 1px solid #e1e6ef; border-radius: 8px; min-height: 132px; padding: 11px; }
    .weekend { background: #f4fbf2; border-color: #cde8c5; }
    .day-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .slot { align-items: center; display: grid; grid-template-columns: minmax(0,1fr) auto 28px; }
    .slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot button { background: transparent; color: #9ca3af; min-height: 28px; padding: 0; }
    .footer-link { max-width: 1360px; margin: 18px auto 0; }
    .footer-link a { align-items: center; background: #111827; border-radius: 8px; color: #fff; display: flex; font-weight: 850; justify-content: center; min-height: 48px; padding: 0 16px; text-decoration: none; }
    @media (max-width: 1050px) { main { padding: 18px; } .top { align-items: stretch; flex-direction: column; } .grid { grid-template-columns: 1fr; } .results, .days { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 640px) { main { padding: 12px; } h1 { font-size: 32px; } .stats, .actions { flex-direction: column; } .form, .results, .days { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="top">
      <div>
        <p class="eyebrow">Planovac party</p>
        <h1>Kdy dame pohyb?</h1>
      </div>
      <div class="stats" id="stats"></div>
    </section>
    <section class="grid">
      <section class="panel">
        <div class="title"><h2>Naklikat cas</h2><p>Jeden radek = jeden volny blok pro jednoho cloveka.</p></div>
        <div class="form">
          <label>Jmeno <input id="name" placeholder="treba Repik"></label>
          <label>Datum <input id="date" type="date"></label>
          <label class="check"><input id="allDay" type="checkbox"> Cely den</label>
          <label>Od <input id="start" type="time" step="1800" value="18:00"></label>
          <label>Do <input id="end" type="time" step="1800" value="20:00"></label>
        </div>
        <div class="actions">
          <button class="primary" id="add">Pridat cas</button>
          <button class="ghost" id="clear">Vycistit</button>
        </div>
        <div class="rules" id="rules"></div>
      </section>
      <section class="panel">
        <div class="title"><h2>Co uz vychazi</h2><p>Nejblizsi terminy prvni.</p></div>
        <div class="results" id="results"></div>
      </section>
    </section>
    <section class="timeline">
      <div class="title"><h2>Dostupnost party</h2><p>Prehled pro nejblizsich 21 dni.</p></div>
      <div class="days" id="days"></div>
    </section>
    <section class="footer-link">
      <a href="./kitlist.html">Otevrit Red Squadron kitlist</a>
    </section>
  </main>
  <script>
    const activities = [
      { id: "gym", title: "Posilka", short: "90 min / 2 lidi", minPeople: 2, duration: 90 },
      { id: "training", title: "Airsoft trening", short: "3,5 h / 5 lidi", minPeople: 5, duration: 210 },
      { id: "event", title: "Airsoft akce", short: "vikend / cely den / 2 lidi", minPeople: 2, duration: 720, weekend: true, allDay: true }
    ];
    const supabaseUrl = "https://djdhpwgihaxjgyjrqctd.supabase.co";
    const supabaseKey = "sb_publishable_mEhqM8cANfm3nQlIgGXekQ_Rr1PE3hB";
    const apiUrl = `${supabaseUrl}/rest/v1/availability_slots`;
    const apiHeaders = { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}`, "Content-Type": "application/json" };
    const key = "sraz-planovac-v1";
    const today = new Date().toISOString().slice(0, 10);
    const demo = [
      { id: crypto.randomUUID(), name: "Repik", date: today, start: "18:00", end: "20:00", allDay: false },
      { id: crypto.randomUUID(), name: "Kamos", date: today, start: "17:30", end: "20:30", allDay: false }
    ];
    let slots = JSON.parse(localStorage.getItem(key) || "null") || demo;
    let sync = "Nacitam Supabase";
    const $ = (id) => document.getElementById(id);
    $("date").value = today;
    $("allDay").addEventListener("change", () => { $("start").disabled = $("end").disabled = $("allDay").checked; });
    $("add").addEventListener("click", () => {
      const name = $("name").value.trim();
      if (!name) return;
      if (!$("allDay").checked && mins($("start").value) >= mins($("end").value)) return;
      const slot = { id: crypto.randomUUID(), name, date: $("date").value, start: $("start").value, end: $("end").value, allDay: $("allDay").checked };
      slots.unshift(slot);
      save();
      insertRemote(slot);
    });
    $("clear").addEventListener("click", async () => {
      slots = [];
      save();
      await fetch(`${apiUrl}?id=neq.00000000-0000-0000-0000-000000000000`, { method: "DELETE", headers: apiHeaders });
      loadRemote();
    });
    function mins(time) { const [h, m] = time.split(":").map(Number); return h * 60 + m; }
    function time(m) { return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; }
    function datePlus(i) { const d = new Date(); d.setDate(d.getDate() + i); return d.toISOString().slice(0, 10); }
    function fmt(date) { return new Intl.DateTimeFormat("cs-CZ", { weekday: "short", day: "numeric", month: "numeric" }).format(new Date(`${date}T12:00:00`)); }
    function weekend(date) { return [0, 6].includes(new Date(`${date}T12:00:00`).getDay()); }
    function names(items) { return [...new Set(items.map((s) => s.name).filter(Boolean))]; }
    function covers(slot, start, end) { return slot.allDay || (mins(slot.start) <= start && mins(slot.end) >= end); }
    function candidates(days) {
      const found = [];
      for (const activity of activities) for (const date of days) {
        if (activity.weekend && !weekend(date)) continue;
        if (activity.allDay) {
          const people = names(slots.filter((s) => s.date === date && s.allDay));
          if (people.length >= activity.minPeople) found.push({ activity, date, start: "cely den", end: "", people });
          continue;
        }
        for (let start = 420; start + activity.duration <= 1320; start += 30) {
          const end = start + activity.duration;
          const people = names(slots.filter((s) => s.date === date && covers(s, start, end)));
          if (people.length >= activity.minPeople) found.push({ activity, date, start: time(start), end: time(end), people });
        }
      }
      return found;
    }
    function toRemote(slot) { return { id: slot.id, name: slot.name, date: slot.date, start_time: slot.start, end_time: slot.end, all_day: slot.allDay }; }
    function fromRemote(row) { return { id: row.id, name: row.name, date: row.date, start: row.start_time.slice(0, 5), end: row.end_time.slice(0, 5), allDay: row.all_day }; }
    async function loadRemote() {
      try {
        const response = await fetch(`${apiUrl}?select=*&order=date.asc,start_time.asc`, { headers: apiHeaders });
        if (!response.ok) throw new Error("Supabase read failed");
        slots = (await response.json()).map(fromRemote);
        sync = "Sdilene pres Supabase";
        save();
      } catch {
        sync = "Lokalni zaloha";
        render();
      }
    }
    async function insertRemote(slot) {
      try {
        await fetch(apiUrl, { method: "POST", headers: { ...apiHeaders, Prefer: "return=minimal" }, body: JSON.stringify(toRemote(slot)) });
        loadRemote();
      } catch {
        sync = "Ulozeno jen lokalne";
        render();
      }
    }
    async function deleteRemote(id) {
      try {
        await fetch(`${apiUrl}?id=eq.${id}`, { method: "DELETE", headers: apiHeaders });
      } finally {
        loadRemote();
      }
    }
    function save() { localStorage.setItem(key, JSON.stringify(slots)); render(); }
    function render() {
      const days = Array.from({ length: 21 }, (_, i) => datePlus(i));
      const hits = candidates(days);
      $("stats").innerHTML = `<span>${names(slots).length} lidi</span><span>${slots.length} casu</span><span>${hits.length} tref</span><span>${sync}</span>`;
      $("rules").innerHTML = activities.map((a) => `<article class="rule"><strong>${a.title}</strong><span>${a.short}</span></article>`).join("");
      $("results").innerHTML = activities.map((a) => {
        const list = hits.filter((h) => h.activity.id === a.id).slice(0, 8);
        return `<article class="result"><h3>${a.title}</h3><span>${a.short}</span>${list.length ? `<ul>${list.map((h) => `<li><strong>${fmt(h.date)}</strong><span class="time">${h.start}${h.end ? "-" + h.end : ""}</span><small>${h.people.join(", ")}</small></li>`).join("")}</ul>` : `<p class="empty">Zatim chybi lidi nebo cas.</p>`}</article>`;
      }).join("");
      $("days").innerHTML = days.map((day) => {
        const daySlots = slots.filter((s) => s.date === day);
        return `<article class="day ${weekend(day) ? "weekend" : ""}"><div class="day-head"><strong>${fmt(day)}</strong><small>${names(daySlots).length} lidi</small></div>${daySlots.length ? `<ul>${daySlots.map((s) => `<li class="slot"><span>${s.name}</span><small>${s.allDay ? "cely den" : s.start + "-" + s.end}</small><button onclick="removeSlot('${s.id}')">x</button></li>`).join("")}</ul>` : `<p class="empty">Nic</p>`}</article>`;
      }).join("");
    }
    window.removeSlot = (id) => { slots = slots.filter((s) => s.id !== id); save(); deleteRemote(id); };
    render();
    loadRemote();
    setInterval(loadRemote, 15000);
  </script>
</body>
</html>
